<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04060C;display:grid;place-items:center;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden;padding:18px 0}
.stage{width:min(97vw,168vh)}
svg{width:100%;height:auto;display:block;background:#06090F;border:1px solid #141D33;border-radius:16px}
svg text{font-family:Vazirmatn,Tahoma,sans-serif;user-select:none}
.t2{fill:#E9EFF8;font-weight:800}
.sub{fill:#93A3C0}
.mut{fill:#5D6E90}
.lat{fill:#4E9FB0;letter-spacing:2px;font-weight:700}
.num{font-weight:700}
.panel{fill:#0B1222;stroke:#1B2742;stroke-width:1.2}
.hair{stroke:#1B2742;stroke-width:1}
.scene{opacity:0;transition:opacity .45s ease}
.scene.on{opacity:1}
/* ── مدل انیمیشن: عناصر با فعال‌شدن صحنه اجرا می‌شوند ── */
.an,.ap,.ag,.aa{opacity:0}
.scene.on .an{animation:kFade .7s cubic-bezier(.2,.7,.3,1) var(--d,0s) forwards}
.scene.on .ap{transform-box:fill-box;transform-origin:center;animation:kPop .8s cubic-bezier(.2,.9,.3,1.2) var(--d,0s) forwards}
.scene.on .ag{transform-box:fill-box;transform-origin:right center;animation:kGrow 1.1s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards}
.scene.on .aa{animation:kArc 1.6s cubic-bezier(.2,.8,.3,1) var(--d,0s) forwards}
.scene.on .ad{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);animation:kDraw 1.1s ease-in-out var(--d,0s) forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spinr 32s linear infinite}
.flw{stroke-dasharray:4 10;animation:kFlow 1.4s linear infinite}
.blink{animation:kBlink 1.1s steps(1) infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:rp 2.6s ease-out infinite}
@keyframes kFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes kPop{0%{opacity:0;transform:scale(.82)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes kGrow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes kDraw{to{stroke-dashoffset:0}}
@keyframes kArc{from{opacity:0;stroke-dashoffset:100}to{opacity:1;stroke-dashoffset:calc(100 - var(--v,0))}}
@keyframes kFlow{to{stroke-dashoffset:-28}}
@keyframes kBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes rp{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
/* ریل مراحل */
.rN circle{fill:#0B1222;stroke:#26365C;stroke-width:1.5;transition:.3s}
.rN text{fill:#5D6E90;transition:.3s}
.rN.on circle{fill:#56C8DC;stroke:#56C8DC}
.rN.on text{fill:#E9EFF8;font-weight:700}
.rN.done circle{fill:#12303A;stroke:#2E7D8F}
.rN.done text{fill:#7E93B5}
/* رابط پایین */
.hud{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(97vw,168vh);margin-top:12px}
.cap{color:#93A3C0;font-size:13px;flex:1;text-align:center;min-height:20px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{background:transparent;border:1px solid #26365C;color:#93A3C0;font-family:inherit;font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;transition:.2s}
.ctl button:hover{border-color:#56C8DC;color:#56C8DC}
#counter{color:#5D6E90;font-size:12px;min-width:86px}
.dots{display:flex;gap:6px;direction:ltr}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid #26365C;background:transparent;cursor:pointer;padding:0;transition:.2s}
.dot.on{background:#56C8DC;border-color:#56C8DC;transform:scale(1.3)}
</style>

  <text x="1360" y="958" text-anchor="middle" font-size="12" class="sub an" style="--d:4.6s">سامانه آراء · تصمیم‌یار جامع محله — هر تصمیم شواهدش را حمل می‌کند و هر پیامد، تصمیم بعدی را هوشمندتر</text>
</g>
</svg>
<div class="hud">
  <div class="ctl"><button id="btnPlay">⏸ توقف</button><button id="btnReplay">↻ از ابتدا</button><span id="counter"></span></div>
  <div class="cap" id="capText"></div>
  <div class="dots" id="dots"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const fa=n=>String(Math.round(n)).replace(/[0-9]/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const styleTag=document.createElement('style');
styleTag.textContent='svg.paused *{animation-play-state:paused!important}';
document.head.appendChild(styleTag);
const stage=$('stageSvg');

const scenes=[
 {id:'s0',dur:7,cap:'افتتاحیه — تصمیم‌یار جامع محله: از شاخص خام تا کارت تصمیم قابل‌استناد',rail:-1},
 {id:'s1',dur:9,cap:'گام ۱ · تعیین محله: ژئوکد، ساخت پنجره تحلیل (AOI) و قفل مکانی',rail:0},
 {id:'s2',dur:9.5,cap:'گام ۲ · گردآوری شواهد: اتصال هم‌زمان به ۹ منبع برخط و تجمیع ۴۱۹ شاخص',rail:1},
 {id:'s3',dur:11,cap:'گام ۳ · موتور تحلیل: نرمال‌سازی تا امتیاز ۸ سرمایه در مقیاس ۰ تا ۱۰۰',rail:2},
 {id:'s4',dur:10,cap:'گام ۴ · تشخیص: زنجیره ظرفیت تا پیامد، نقشه عدالت و تیپ محله',rail:3},
 {id:'s5',dur:9.5,cap:'گام ۵ · کارت تصمیم: گیج اعتماد، رتبه‌بندی مداخله‌ها و خروجی استاندارد',rail:4},
 {id:'s6',dur:11,cap:'گام ۶ · یادگیری: ثبت در حافظه زنده و بستن چرخه تصمیم ← پیامد',rail:5}
];

const dotsBox=$('dots');
scenes.forEach((s,i)=>{
 const d=document.createElement('button');d.className='dot';d.title=s.cap;
 d.onclick=()=>{resumeAll();play(i)};dotsBox.appendChild(d);
});

let timers=[],intvls=[],cur=0,sceneStart=0,paused=false;
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function clearAll(){timers.forEach(clearTimeout);intvls.forEach(clearInterval);timers=[];intvls=[]}
function count(el,to,dur,delay){
 later(()=>{const t0=performance.now();
  const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/dur);
   el.textContent=fa(to*(1-Math.pow(1-p,3)));if(p>=1)clearInterval(iv)},40);
  intvls.push(iv)},delay*1000);
}
function resumeAll(){if(paused){paused=false;stage.classList.remove('paused');stage.unpauseAnimations();$('btnPlay').textContent='⏸ توقف';play(cur,scenes[cur].dur-(performance.now()-sceneStart)/1000)}}

const FX={
 s1(){const t=$('typeIn'),txt='باغ فیض، تهران';t.textContent='';
  later(()=>{let i=0;const iv=setInterval(()=>{t.textContent=txt.slice(0,++i);
   if(i>=txt.length){clearInterval(iv);$('caret').style.display='none';
    const b=$('btnGo');b.style.filter='url(#soft)';
    b.querySelector('rect').setAttribute('fill','rgba(86,200,220,.28)');
    later(()=>{b.style.filter='';b.querySelector('rect').setAttribute('fill','rgba(86,200,220,.1)')},900);}},120)},700);},
 s2(){count($('indCount'),419,2200,.8);
  later(()=>{const p=$('prog2');p.style.transition='width 2.2s cubic-bezier(.2,.8,.2,1)';p.setAttribute('width','472')},800);},
 s3(){document.querySelectorAll('#s3 .cval').forEach((el,i)=>count(el,+el.dataset.to,1200,1.6+i*.18));},
 s5(){document.querySelectorAll('#s5 .qnum').forEach((el,i)=>count(el,+el.dataset.to,1500,1.1+i*.15));
  later(()=>{try{$('morphD').beginElement();$('morphF').beginElement();$('morphS').beginElement();}catch(e){}
   const B=[['!','بحرانی','#D96666'],['◔','نیازمند توجه','#D9A441'],['✓','پایدار','#55B886']];
   const g=$('bandGlyph'),l=$('bandLabel');
   B.forEach((b,i)=>later(()=>{g.textContent=b[0];g.setAttribute('fill',b[2]);l.textContent=b[1];l.setAttribute('fill',b[2])},i*1733));
  },2200);}
};

function play(i,rem){
 clearAll();cur=i;const s=scenes[i];
 document.querySelectorAll('.scene').forEach(el=>el.classList.remove('on'));
 const el=$(s.id);void el.getBoundingClientRect();el.classList.add('on');
 sceneStart=performance.now();
 document.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('on',k===i));
 $('capText').textContent=s.cap;
 $('counter').textContent='صحنه '+fa(i+1)+' / '+fa(7);
 for(let k=0;k<6;k++){const r=$('r'+k);if(!r)continue;
  r.classList.toggle('on',s.rail===k);r.classList.toggle('done',s.rail>=0&&s.rail>k);}
 if(FX[s.id])FX[s.id]();
 later(()=>{if(!paused)play((i+1)%scenes.length)},(rem!==undefined?rem:s.dur)*1000);
}

$('btnPlay').onclick=()=>{
 if(!paused){paused=true;stage.classList.add('paused');stage.pauseAnimations();
  clearAll();$('btnPlay').textContent='▶ ادامه';}
 else resumeAll();
};
$('btnReplay').onclick=()=>{resumeAll();play(0)};
play(0);
</script>
</body>
</html>

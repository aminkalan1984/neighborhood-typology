<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موشن‌گرافیک جدید | تصمیم‌یار جامع محله</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#070d1a;--ink:#e8eefc;--mut:#8ea3c8;--cyan:#22d3ee;--teal:#2dd4bf;--vio:#a78bfa;--amb:#fbbf24;--rose:#fb7185;--grn:#34d399}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(1200px 800px at 70% 8%,#0e1930,#05090f 62%);
font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;color:var(--ink);direction:rtl;padding:18px}
.stage{position:relative;width:min(1500px,97vw);aspect-ratio:16/9;border-radius:24px;overflow:hidden;
background:linear-gradient(160deg,#0a1226,#0b1526 45%,#090f1e);
border:1px solid #16233f;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 120px rgba(34,211,238,.04)}
svg{width:100%;height:100%;display:block;font-family:inherit}
.chrome{position:absolute;inset-inline:0;display:flex;align-items:center;justify-content:space-between;
padding:14px 22px;z-index:6;pointer-events:none}
.chrome.top{top:0}.chrome.bottom{bottom:0}
.brand{display:flex;gap:9px;align-items:center;font-weight:800;font-size:14px}
.brand .live{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 12px var(--grn);animation:blink 2s infinite}
.piece{font-size:12px;color:var(--mut);font-weight:600}
.controls{pointer-events:auto;display:flex;align-items:center;gap:12px}
.ctrl{border:1px solid #22345c;background:rgba(13,22,40,.8);color:var(--ink);border-radius:10px;
padding:7px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.25s}
.ctrl:hover{border-color:var(--cyan);color:var(--cyan)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:26px;height:5px;border-radius:99px;background:#223457;border:none;cursor:pointer;transition:.35s;padding:0}
.dot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan);width:38px}
.counter{font-size:11px;color:var(--mut);font-weight:700;min-width:74px;text-align:center}
.caption{position:absolute;bottom:66px;inset-inline:0;text-align:center;pointer-events:none;z-index:5}
.caption .inner{display:inline-block;max-width:820px;background:rgba(9,16,32,.78);backdrop-filter:blur(8px);
border:1px solid #1d2c4d;border-radius:14px;padding:10px 22px;font-size:13.5px;line-height:1.9;
color:#cdd9f2;transition:opacity .25s;font-weight:600}
.scene{opacity:0;visibility:hidden;transition:opacity .7s ease}
.scene.on{opacity:1;visibility:visible}
.box{fill:#0e1a30;stroke:#253a63;stroke-width:1.4}
.lbl{fill:var(--ink);font-weight:800}
.sub{fill:var(--mut);font-weight:600}
.flowbg{fill:none;stroke:#18294a;stroke-width:2.5;stroke-linecap:round}
.flow{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linecap:round}
.flowC{fill:none;stroke:var(--cyan);stroke-width:2.5;stroke-linecap:round}
.flowdash{stroke-dasharray:3 11;animation:flowdash 1.1s linear infinite}
.ringpulse{animation:ringPulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.spin-slow{animation:spin 26s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringPulse{0%{opacity:.75;transform:scale(.45)}100%{opacity:0;transform:scale(1.7)}}
@keyframes flowdash{to{stroke-dashoffset:-28}}
</style>
</head>
<body>
<div class="stage">
  <div class="chrome top">
    <div class="brand"><span class="live"></span> سامانه آراء — اتاق وضعیت حکمرانی ایران</div>
    <div class="piece">موشن‌گرافیک | ماژول تصمیم‌یار جامع محله</div>
  </div>
  <svg id="stageSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="hubG" cx="50%" cy="40%" r="70%">
        <stop offset="0%" stop-color="#123047"/><stop offset="100%" stop-color="#0b1a2e"/>
      </radialGradient>
      <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#101d36"/><stop offset="100%" stop-color="#0b1526"/>
      </linearGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
      </filter>
    </defs>
<!--NEWSCENES-->
  </svg>
  <div class="caption"><span class="inner" id="capText"></span></div>
  <div class="chrome bottom">
    <div class="controls">
      <button class="ctrl" id="btnPlay">⏸ توقف</button>
      <button class="ctrl" id="btnReplay">↺ پخش مجدد</button>
    </div>
    <div class="controls">
      <span class="counter" id="counter"></span>
      <div class="dots" id="dots"></div>
    </div>
  </div>
</div>
<script>
/*NEWJS*/
</script>
</body>
</html>

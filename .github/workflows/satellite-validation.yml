name: Satellite validation

on:
  push:
    paths:
      - "server/satellite*.ts"
      - "scripts/satellite*.py"
      - "scripts/test_satellite*.py"
      - "scripts/requirements-satellite.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/satellite-validation.yml"
  pull_request:
    paths:
      - "server/satellite*.ts"
      - "scripts/satellite*.py"
      - "scripts/test_satellite*.py"
      - "scripts/requirements-satellite.txt"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-satellite.txt
      - run: npm run ci:satellite
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-validation-report
          path: artifacts/satellite-validation-report.json
          if-no-files-found: warn

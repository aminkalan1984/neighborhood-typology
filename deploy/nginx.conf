# ============================================================
# سامانه آرا — reverse proxy (nginx)
# نصب:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/ara
#       sudo ln -s /etc/nginx/sites-available/ara /etc/nginx/sites-enabled/ara
#       sudo nginx -t && sudo systemctl reload nginx
# سپس TLS:  sudo certbot --nginx -d ara.example.ir
# نکته: کانتینر روی 127.0.0.1:8080 بالا می‌آید (docker-compose.yml).
# ============================================================

upstream ara_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# نرخ‌محدودسازی ساده در برابر سوءاستفاده از APIهای سنگین
limit_req_zone $binary_remote_addr zone=ara_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ara_ai:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ara.example.ir;   # ← دامنهٔ خود را جایگزین کنید

    # برای certbot http-01 (اگر certbot --nginx استفاده نمی‌کنید)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # در غیر این‌صورت همه به HTTPS هدایت می‌شوند
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ara.example.ir;   # ← دامنهٔ خود را جایگزین کنید

    # مسیرها پس از اجرای certbot ساخته می‌شوند
    ssl_certificate     /etc/letsencrypt/live/ara.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ara.example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # هدرهای امنیتی
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # آپلود/بدنه: درخواست‌های تصمیم‌یار بزرگ می‌شوند (مشاهدات + پیمایش)
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/geo+json
        application/xml image/svg+xml;

    # ---------- سامانه مدل: پاسخ استریم (SSE) ----------
    location /api/anthropic/ {
        limit_req zone=ara_ai burst=10 nodelay;
        proxy_pass http://ara_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # بدون بافر تا توکن‌ها زنده برسند
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- APIهای سنگین (اجرای الگوریتم، پیمایش، پردازش ماهواره‌ای) ----------
    location ~ ^/api/(decision-support|typology|kernel|satellite)/ {
        limit_req zone=ara_api burst=40 nodelay;
        proxy_pass http://ara_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;      # کارهای COG و kernel طولانی‌اند
        proxy_send_timeout 600s;
        client_max_body_size 25m;
    }

    # ---------- بقیهٔ APIها ----------
    location /api/ {
        limit_req zone=ara_api burst=60 nodelay;
        proxy_pass http://ara_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------- دارایی‌های نسخه‌دار (hash در نام فایل) ----------
    location /assets/ {
        proxy_pass http://ara_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- کاشی‌های برداری و لایه‌های سنگین PBF ----------
    location /data/pbf/ {
        proxy_pass http://ara_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------- فونت و تصویر ----------
    location ~* \.(woff2|woff|ttf|png|jpe?g|webp|svg|ico)$ {
        proxy_pass http://ara_app;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # ---------- ثنا و SPA ----------
    location / {
        proxy_pass http://ara_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
